<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Jarvis AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#14294b,#070b14 70%);color:#edf4ff;font-family:Arial,sans-serif;display:grid;place-items:center;padding:20px}
main{width:100%;max-width:440px;text-align:center}
.orb{width:120px;height:120px;margin:0 auto 20px;border:2px solid #58d9ff;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 35px #168bff88;animation:pulse 3s infinite}
.orb span{font-size:40px;color:#8deaff}
@keyframes pulse{50%{box-shadow:0 0 55px #168bffaa}}
h1{letter-spacing:6px;font-size:30px;margin:.3em 0}
p{color:#9bb0ce}
.status{padding:12px;background:#0d1728;border:1px solid #243a5b;border-radius:12px;margin:18px 0;text-align:left;font-size:14px;line-height:1.7}
.status b{display:inline-block;min-width:118px;color:#9bb0ce;font-weight:normal}
.ok{color:#6ee7a0}.ko{color:#ff8a8a}.wa{color:#ffd37a}
button,input{width:100%;padding:14px;margin:6px 0;border:1px solid #4baeff;border-radius:12px;font-size:15px}
button{background:#124b7c;color:#fff;cursor:pointer}
button.sec{background:transparent;color:#9bb0ce;border-color:#243a5b}
button:disabled{opacity:.45}
input{background:#0d1728;color:#fff;border-color:#243a5b}
#message{font-size:14px;line-height:1.5;overflow-wrap:anywhere;white-space:pre-wrap;text-align:left}
small{color:#5f7596}
</style>
</head>
<body>
<main>
<div class="orb"><span>J</span></div>
<h1>JARVIS AI</h1>
<p>Il tuo assistente personale</p>

<div class="status" id="status">
 <div><b>Installazione</b><span id="rInstall">…</span></div>
 <div><b>Permesso</b><span id="rPerm">…</span></div>
 <div><b>Service worker</b><span id="rSw">…</span></div>
 <div><b>Sottoscrizione</b><span id="rSub">…</span></div>
 <div><b>Chiave browser</b><span id="rBrowserKey">…</span></div>
 <div><b>Chiave server</b><span id="rServerKey">…</span></div>
 <div><b>Coppia VAPID</b><span id="rPair">…</span></div>
</div>

<button id="enable">1 · Attiva notifiche push</button>
<button id="reset" class="sec">Reimposta sottoscrizione</button>
<input id="token" type="password" placeholder="Token di test (JARVIS_TEST_TOKEN)" autocomplete="off">
<button id="test" disabled>2 · Invia notifica di prova ora</button>
<button id="testDelay" disabled>3 · Invia tra 15 secondi (chiudi l'app)</button>
<p id="message">Sistema in avvio.</p>
<small id="build"></small>
</main>
<script>
"use strict";

const BUILD = "2026-10-21-a";
const SUPABASE_URL = "https://razumirsnqxmakbpdldi.supabase.co";
const SUPABASE_KEY = "sb_publishable_R1cuHk3DVt-mC7FwE7djlA_faLKRj7z"; // chiave pubblicabile, non segreta
const FN = SUPABASE_URL + "/functions/v1/jarvis-push-test";

const $ = (id) => document.getElementById(id);
const say = (m) => { $("message").textContent = m; };
const put = (id, text, cls) => { const e = $(id); e.textContent = text; e.className = cls || ""; };
const b64u = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const fromB64u = (s) => { const p = "=".repeat((4 - s.length % 4) % 4); return Uint8Array.from(atob((s + p).replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0)); };
const fp = (k) => (k ? k.slice(0, 8) + "…" + k.slice(-4) : "—");

let server = null; // risposta di ?action=status (la chiave pubblica arriva dal server: unica fonte di verità)
$("build").textContent = "build " + BUILD;

const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isStandalone = window.navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;

function store(fn) { try { return fn(); } catch { return null; } }

async function loadServer() {
  const r = await fetch(FN + "?action=status", { headers: { apikey: SUPABASE_KEY } });
  server = await r.json();
  put("rServerKey", fp(server.publicKey) + " (" + server.publicKeyBytes + " byte)", server.publicKeyBytes === 65 ? "ok" : "ko");
  put("rPair", server.pairMatches ? "coerente" : "NON coerente", server.pairMatches ? "ok" : "ko");
  if (!server.subjectValid) say("VAPID_SUBJECT non valido: imposta mailto:tua@email-reale.it nei Secrets.");
  if (!server.tokenConfigured) say("JARVIS_TEST_TOKEN non configurato nei Secrets (min 16 caratteri).");
}

async function getReg() {
  if (!("serviceWorker" in navigator)) throw Error("Service worker non supportati.");
  await navigator.serviceWorker.register("/service-worker.js", { scope: "/" });
  return await navigator.serviceWorker.ready;
}

async function refresh() {
  if (isIOS && !isStandalone) put("rInstall", "NON installata: Condividi → Aggiungi alla schermata Home", "ko");
  else put("rInstall", isStandalone ? "PWA installata" : "browser (ok su desktop)", "ok");

  const perm = "Notification" in window ? Notification.permission : "non supportato";
  put("rPerm", perm, perm === "granted" ? "ok" : perm === "denied" ? "ko" : "wa");

  let sub = null, match = false;
  try {
    const reg = await getReg();
    put("rSw", "attivo, scope " + new URL(reg.scope).pathname, "ok");
    sub = await reg.pushManager.getSubscription();
  } catch (e) { put("rSw", "errore: " + e.message, "ko"); }

  if (sub) {
    const k = sub.options.applicationServerKey ? b64u(sub.options.applicationServerKey) : "";
    match = !!server && k === server.publicKey;
    put("rSub", "presente (" + new URL(sub.endpoint).hostname + ")", "ok");
    put("rBrowserKey", fp(k) + (server ? (match ? " = server" : " ≠ server") : ""), match ? "ok" : "ko");
  } else {
    put("rSub", "assente", "wa");
    put("rBrowserKey", "—");
  }
  const ready = !!sub && match;
  $("test").disabled = !ready;
  $("testDelay").disabled = !ready;
  return { sub, match };
}

$("token").value = store(() => localStorage.getItem("jarvis_token")) || "";
$("token").addEventListener("change", () => store(() => localStorage.setItem("jarvis_token", $("token").value.trim())));

$("enable").addEventListener("click", async () => {
  try {
    if (!("Notification" in window) || !("PushManager" in window)) throw Error("Notifiche push non supportate (su iPhone installa prima la PWA).");
    if (!window.isSecureContext) throw Error("Serve HTTPS.");
    if (isIOS && !isStandalone) throw Error("Su iPhone apri Jarvis dall'icona nella schermata Home, non da Safari.");
    if (!server || !server.pairMatches || server.publicKeyBytes !== 65) throw Error("Il server non ha una coppia VAPID valida (vedi 'Coppia VAPID').");

    // Il permesso va chiesto SUBITO, dentro il tocco dell'utente (nessun await prima).
    const permission = await Notification.requestPermission();
    if (permission !== "granted") throw Error("Permesso notifiche non concesso: " + permission);

    const reg = await getReg();
    let sub = await reg.pushManager.getSubscription();
    if (sub && (!sub.options.applicationServerKey || b64u(sub.options.applicationServerKey) !== server.publicKey)) {
      await sub.unsubscribe(); // sottoscrizione vecchia creata con un'altra chiave
      sub = null;
    }
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: fromB64u(server.publicKey) });
    await refresh();
    say("Sottoscrizione creata con la chiave del server. Il permesso NON equivale a una notifica consegnata: ora premi 'Invia notifica di prova'.");
  } catch (e) { say(e.message || String(e)); await refresh(); }
});

$("reset").addEventListener("click", async () => {
  try {
    const reg = await getReg();
    const sub = await reg.pushManager.getSubscription();
    if (sub) await sub.unsubscribe();
    await refresh();
    say("Sottoscrizione eliminata in QUESTO contesto (PWA o browser). Premi 'Attiva notifiche push'.");
  } catch (e) { say(e.message || String(e)); }
});

async function send(delaySeconds) {
  $("test").disabled = true; $("testDelay").disabled = true;
  try {
    const { sub } = await refresh();
    if (!sub) throw Error("Attiva prima le notifiche.");
    const token = $("token").value.trim();
    if (!token) throw Error("Inserisci il token di test.");
    store(() => localStorage.setItem("jarvis_token", token));
    const r = await fetch(FN, {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY, "x-jarvis-token": token },
      body: JSON.stringify({ subscription: sub.toJSON(), delaySeconds }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw Error("HTTP " + r.status + " — " + (j.error || "errore") + (j.pushStatus ? " (push " + j.pushStatus + ")" : "") + (j.pushBody ? "\n" + j.pushBody : "") + (j.hint ? "\n→ " + j.hint : ""));
    say(j.scheduled
      ? "Richiesta accettata (HTTP 202). Chiudi l'app: la notifica parte tra " + j.delaySeconds + " s. L'invio reale va verificato sul telefono."
      : "Il push service ha accettato il messaggio (HTTP " + j.pushStatus + "). Verifica che la notifica sia arrivata sul dispositivo.");
  } catch (e) { say(e.message || String(e)); }
  finally { await refresh(); }
}
$("test").addEventListener("click", () => send(0));
$("testDelay").addEventListener("click", () => send(15));

(async () => {
  try { await loadServer(); } catch (e) { put("rServerKey", "irraggiungibile", "ko"); say("Impossibile contattare la funzione: " + e.message); }
  await refresh();
  if (!message_set()) say("Pronto.");
})();
function message_set() { return $("message").textContent !== "Sistema in avvio."; }
</script>
</body>
</html>
